<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Georgia Bite Score app icon: bass silhouette + score arc on the near-black
       UGA theme, Bulldog red accent (#ba0c2f). Source of truth for all PNG sizes
       (regenerate with: node scripts/generate-icons.mjs). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17171b"/>
      <stop offset="1" stop-color="#0b0b0d"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- score arc -->
  <circle cx="256" cy="256" r="176" fill="none" stroke="#2a2a30" stroke-width="28"/>
  <path d="M 256 80 A 176 176 0 1 1 106.6 336" fill="none" stroke="#ba0c2f"
        stroke-width="28" stroke-linecap="round"/>
  <!-- fish silhouette: body + forked tail + dorsal fin, facing right -->
  <g fill="#f5f5f7">
    <ellipse cx="266" cy="266" rx="106" ry="56"/>
    <path d="M172 266 L112 222 L134 266 L112 310 Z"/>
    <path d="M240 214 q30 -34 74 -30 q-14 22 -22 38 z"/>
  </g>
  <circle cx="330" cy="252" r="9" fill="#0b0b0d"/>
</svg>
